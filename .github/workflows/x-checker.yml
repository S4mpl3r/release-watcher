name: X Checker

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: x-checker
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  check-x:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Restore X history cache
        id: restore-cache
        uses: actions/cache/restore@v5
        with:
          path: x_history.json
          key: x-history-live

      - name: Initialize history if missing
        run: |
          if [ ! -f x_history.json ]; then
            echo '{"accounts": {}, "session": {}}' > x_history.json
          fi

      - name: Run X Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_X_TOPIC_ID: ${{ secrets.TELEGRAM_X_TOPIC_ID }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_ACCOUNT: ${{ secrets.X_ACCOUNT }}
        run: |
          python scripts/x_checker.py

      - name: Delete old cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache delete x-history-live || true

      - name: Save X history cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: x_history.json
          key: x-history-live
